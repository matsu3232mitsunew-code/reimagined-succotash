<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ローマ字タイピング</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="hud">
      <div><span class="label">残り</span><span id="time">60</span>秒</div>
      <div><span class="label">スコア</span><span id="score">0</span></div>
      <div><span class="label">コンボ</span><span id="combo">0</span></div>
    </header>

    <div class="timebar"><div id="timebar-fill"></div></div>

    <section id="screen-start" class="screen">
      <h1>ローマ字タイピング</h1>
      <p>60秒でどれだけ打てるかな？<br>「shi / si」「tsu / tu」などどの打ち方でもOK。</p>
      <p class="hint"><kbd>Space</kbd> でスタート</p>
    </section>

    <section id="screen-play" class="screen hidden">
      <div id="word" class="word"></div>
      <div id="kana" class="kana"></div>
      <div class="romaji"><span id="typed" class="typed"></span><span id="next" class="next"></span><span id="rest" class="rest"></span></div>
    </section>

    <section id="screen-result" class="screen hidden">
      <h2>結果</h2>
      <div id="rank" class="rank"></div>
      <dl class="stats">
        <dt>スコア</dt><dd id="r-score"></dd>
        <dt>正しく打った数</dt><dd id="r-correct"></dd>
        <dt>ミス</dt><dd id="r-miss"></dd>
        <dt>正確率</dt><dd id="r-acc"></dd>
        <dt>速さ</dt><dd id="r-kpm"></dd>
        <dt>最大コンボ</dt><dd id="r-combo"></dd>
        <dt>ベスト</dt><dd id="r-best"></dd>
      </dl>
      <p class="hint"><kbd>Space</kbd> でもう一度　<kbd>Esc</kbd> でタイトル</p>
    </section>

    <input id="mobile-input" class="mobile-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="入力">
  </main>

  <script src="romaji.js"></script>
  <script src="words.js"></script>
  <script src="game.js"></script>
</body>
</html>
